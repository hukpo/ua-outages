name: Release

# Publishes to npm when a version tag is pushed (`npm version patch && git push --follow-tags`).
# Uses npm trusted publishing (OIDC): no token in the repo. Set it up once on npmjs.com →
# ua-outages → Settings → Trusted publishing: GitHub Actions, hukpo/ua-outages, release.yml.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Not on npm yet
        id: check
        run: |
          if npm view "ua-outages@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "${GITHUB_REF_NAME} is already on npm, nothing to publish"
          else
            echo "publish=1" >> "$GITHUB_OUTPUT"
          fi
      # prepublishOnly runs typecheck, tests and build
      - if: steps.check.outputs.publish
        run: npm publish
      # Whoever published it (this job or a maintainer's `npm publish`), the package on npm must
      # be this tag's code: a stale dist/ once shipped 0.2.0 with 0.1.1's build. Fails loudly if not.
      - name: Published package is this tag's build
        run: |
          npm run build
          v="${GITHUB_REF_NAME#v}"
          for i in 1 2 3 4 5 6; do
            npm pack "ua-outages@$v" --pack-destination "$RUNNER_TEMP" >/dev/null 2>&1 && break
            sleep 20
          done
          tar xzf "$RUNNER_TEMP/ua-outages-$v.tgz" -C "$RUNNER_TEMP"
          diff -r dist "$RUNNER_TEMP/package/dist"
